name: BlockRacing
version: 26.3.1
main: top.lqsnow.blockracing.Main
api-version: '26.3'
authors: [ LQ_Snow, xiaojiuwo233, FHSHKL ]
description: The first team to collect the required blocks wins
folia-supported: true
loadbefore:
  - BlockRacingAddon
softdepend:
  - voicechat
depend:
  - PlaceholderAPI
  - SimpleScore
commands:
  tp:
    usage: "/tp <Teammate>"
    description: "TP to teammate."
  locatestructure:
    usage: "/locatestructure <structure|#tag>"
    description: "Locate structure."
  locatebiome:
    usage: "/locatebiome <biome|#tag>"
    description: "Locate biome."
  restartgame:
    usage: "/restartgame"
    description: "Restart the game."
  debug:
    usage: "/debug"
    description: "Debug."
    permission: op
  menu:
    usage: "/menu"
    description: "Open the menu."
  waypoint:
    usage: "/waypoint"
    description: "Run waypoint commands."
  block:
    usage: "/block <team> <number>"
    description: "Query block."
  breload:
    usage: "/breload"
    description: "Reload BlockRacing config and block lists."
    permission: op
  randomteam:
    usage: "/randomteam [confirm]"
    description: "Request or confirm balanced random teams."
  forcestart:
    usage: "/forcestart"
    description: "Force start the game and ignore ready status."
    permission: op
  shout:
    aliases: [all]
    usage: "/shout <message>"
    description: "Send a message to every player."
  language:
    aliases: [lang]
    usage: "/language [auto|zh_cn|en_us]"
    description: "Select your display language."
