# BlockRacing game settings
# This file preserves the current game settings across server restarts.
# Settings are saved automatically when the server stops.
# While the server is running, change these options through the in-game menu.
# Player languages are selected independently with /language and are not configured here.

# Optional block pools in addition to the required easy pool
medium-block: false
hard-block: false
dyed-block: false
end-block: false

# Total number of target blocks in one game
block-amount: 50

# Game mode:
# normal - Teams receive different random target lists.
# racing - Teams receive the same targets in the same order.
game-mode: normal

# Speed mode:
# Gives players additional starting items and effects. Each collected block is
# worth 3 points instead of 1.
# Items: Silk Touch iron pickaxe, cooked beef, damaged elytra and Mending book
# Effect: Haste V
speed-mode: false

# Team supply (speed mode menu "Buy Team Supplies"):
# Points spent to purchase the team supply
supply-price: 5
# true - give every online teammate; false - give only the buying player
supply-give-all: true
# Items granted by the team supply (same rules as base-mode-items)
supply-items:
  - material: GOLDEN_CARROT
    amount: 16
  - material: FIREWORK_ROCKET
    amount: 32

# Team chest gift:
# When enabled, a configurable number of a collected target block is placed into
# the opponent's team chest. Independent of game mode; can be combined with any mode.
team-chest-gift: false

# Number of blocks placed into the opponent's chest each time (range 1-64).
# Can also be changed by right-clicking the "Team Chest Gift" button in the menu.
team-chest-gift-amount: 64

# Number of shared chests per team (default: 8, maximum: 53)
max-team-chest-num: 8

# Number of waypoints per team (default: 8, maximum: 53)
max-team-waypoint-num: 8

# Maximum number of target rerolls available to each team per game
# This is an administrator setting and is not exposed in the preparation menu.
max-roll-count: 3

# Internal compatibility value. Do not edit this manually.
config-version: 26.3.1
