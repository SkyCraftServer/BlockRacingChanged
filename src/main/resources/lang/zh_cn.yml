# BlockRacing 语言文件
# 该文件存储了游戏中除了方块名的所有语言文字
# 如果需要翻译方块名，请查看 https://github.com/SkyCraftServer/BlockRacing/blob/3.0/docs/zh/TranslationTutorial-zh.md 的教程
# 如需这个文件的翻译，可直接复制文件内容给ChatGPT，让他帮忙翻译
# BlockRacing language files
# This file stores all language characters in the game except block names.
# If you need to translate the block name, please check the tutorial at https://github.com/SkyCraftServer/BlockRacing/blob/3.0/docs/en/TranslationTutorial-en.md
# If you need to translate this file, you can directly copy the file content to ChatGPT and let him help translate it.

# 当前语言: 简体中文
lang: zh_cn
prefix: "[<gradient:#1cfadf:#14f3ea:#0bebf4:#03e4ff><b>方块竞速</b></gradient>]"

# 记分板
# 计分板由 SimpleScore 根据 blockracing_scoreboard_line_count 自动选择行数布局。
# 如果某一行不需要显示，直接返回空字符串即可；如果需要保留空行，请返回一个空格。
# 注意！最终显示在记分板上的每一行，总字符数不能超过30，这是一行的最大显示范围！
scoreboard:
  game-mode:
    normal: "&a普通模式"
    racing: "&3竞速模式"
    contest: "&6争夺模式"
    time: "&e计时模式"
    nether: "<gradient:#fa0000:#ff3434>下界模式</gradient>"
    speed: "<gradient:#40dbc8:#5deae1>极速模式</gradient>"
    gift: "<gradient:#ff8c00:#ffd700>箱子馈赠</gradient>"
  blocks:
    easy: "&a简单"
    medium: "&e中等"
    hard: "&c困难"
    dyed: "&d染色"
    addon: "<gradient:#b7d9af:#06d9f3>扩展</gradient>"
    end: "&e末地"
    nether: "<gradient:#fa0000:#ff3434>下界</gradient>"
  common:
    brand: "<gray>BlockRacing</gray> <yellow>v%version%</yellow>"
    mode-line: "<aqua>模式：</aqua><yellow>%mode%</yellow>"
    mode-detail:
      time-left: "<gold>剩余时间：<white>%time%</white>"
      overtime: "<red>加时赛</red>"
      default: ""
  pregame:
    title: "<gradient:#1cfadf:#14f3ea:#0bebf4:#03e4ff><b>方块竞速</b></gradient>"
    slot11: ""
    slot10: "&a&lShift+F打开菜单"
    slot9: "&e如果无法打开，"
    slot8: "&e请检查&l潜行&e和&l切换副手&e的快捷键"
    slot7: " "
    slot6: "&b当前模式：&e%game_mode%"
    slot5: "&b目标方块数量：&e%block_amount%"
    slot4: "&b目标方块库："
    slot3: "%blocks%"
    slot2: " "
    slot1: ""
    time-mode-info: "&b计时模式时间：&e%minutes% 分钟"
  ingame:
    title: "<gradient:#1cfadf:#14f3ea:#0bebf4:#03e4ff><b>方块竞速</b></gradient>"
    red-score: "&c红队：&e%score%分  &b(%current_block%/%total_block%)"
    blue-score: "&9蓝队：&e%score%分  &b(%current_block%/%total_block%)"
    red-score-time: "<red>红队：</red><yellow>%score%分</yellow> <gray>|</gray> <aqua>已收集：</aqua><white>%current_block%</white>"
    blue-score-time: "<blue>蓝队：</blue><yellow>%score%分</yellow> <gray>|</gray> <aqua>已收集：</aqua><white>%current_block%</white>"
    block-format: "%difficulty% | %block%"
    dividing-line: "----------------"
    bottom-slot: "<gray>BlockRacing</gray> <yellow>v%version%</yellow>"
    time-left: "&e剩余时间: &f%time%"
    overtime: "&c加时赛"
    block-difficulty:
      easy: "&a简单"
      medium: "&e中等"
      hard: "&c困难"
      dyed: "&d染色"
      addon: "<gradient:#b7d9af:#06d9f3>扩展</gradient>"
      end: "&e末地"
      nether: "<gradient:#fa0000:#ff3434>下界</gradient>"
  end:
    title: "<gradient:#1cfadf:#03e4ff><b>方块竞速</b></gradient>"
    status: "<aqua>比赛结束</aqua>"
    winner:
      red: "<red>红队获胜！</red>"
      blue: "<blue>蓝队获胜！</blue>"
      draw: "<yellow>平局</yellow>"
    red-score: "&c红队：&e%score%分  &b(%current_block%/%total_block%)"
    blue-score: "&9蓝队：&e%score%分  &b(%current_block%/%total_block%)"
    red-score-time: "<red>红队：</red><yellow>%score%分</yellow> <gray>|</gray> <aqua>总计：</aqua><white>%current_block%</white>"
    blue-score-time: "<blue>蓝队：</blue><yellow>%score%分</yellow> <gray>|</gray> <aqua>总计：</aqua><white>%current_block%</white>"

# 服务器列表 MOTD
motd:
  pregame: "<gradient:#1cfadf:#14f3ea:#0bebf4:#03e4ff><b>BlockRacing</b></gradient> <gray>|</gray> <aqua>等待准备</aqua>\n<yellow>当前模式：</yellow><white>%mode%</white>"
  ingame: "<gradient:#ff8a00:#ff3434><b>BlockRacing</b></gradient> <gray>|</gray> <red>游戏进行中</red>\n<yellow>红队</yellow><white>%red_current_block%</white><gray> / </gray><yellow>蓝队</yellow><white>%blue_current_block%</white>%time_part%"
  end: "<gradient:#1cfadf:#03e4ff><b>BlockRacing</b></gradient> <gray>|</gray> <gold>本局结束</gold>\n<aqua>欢迎加入下一局</aqua>"

# 队伍
team:
  red:
    name: "&c红队"
    prefix: "&c[红队]"
    chat: "&c[红队] %s: &f%s"
    color: "&c"
  blue:
    name: "&9蓝队"
    prefix: "&9[蓝队]"
    chat: "&9[蓝队] %s: &f%s"
    color: "&9"

