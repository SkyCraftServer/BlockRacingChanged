# 聊天
chat:
  global-format: "&8[&e&l全体&8] %team% &f%player%&7: &f%message%"
  team-hint: "&8[&b提示&8] &7您正在队伍聊天中。使用 &f/shout 消息&7 或以 &f@ / ! &7开头可发送全体消息。"

# 规则书
rule-book:
  title: "&b方块竞速规则"
  author: "&7BlockRacing"
  pages:
    - "&b&l原版改动\n\n&0• 游戏进行中聊天为队伍聊天\n• 使用 /shout 或以 @ / ! 开头可全服喊话\n• /tp 仅能传送队友\n• 使用 /teleport 或 /minecraft:tp 执行原版传送"
    - "&b&l管理员设置\n\n&0队伍箱子数、记录点数和每局轮换次数可在 config.yml 中修改。\n\n配置项：\nmax-team-chest-num\nmax-team-waypoint-num\nmax-roll-count"
    - "&b&l核心规则\n\n&0两支队伍收集记分板上显示的目标方块。\n\n率先完成所有目标的队伍获胜。"
    - "&b&l模式与积分\n\n&0普通：两队目标完全随机\n\n竞速：两队共享相同目标\n\n极速：每个目标3分\n\n给对方的队伍箱子送方块由独立开关「队伍箱子馈赠」控制"
    - "&b&l菜单功能\n\n&0按 Shift+F 打开菜单\n\n队伍箱子：共享物品\n记录点：保存/传送\n轮换：全队投票\n定位：消耗积分\n随机传送：首次免费\n极速补给：5积分"
    - "&b&l命令 1/2\n\n&0/language 切换语言\n/randomteam 平衡分队\n/block <队伍> <编号> 查看完整目标名\n/tp <玩家> 队友传送\n/shout <消息> 全服聊天"
    - "&b&l命令 2/2\n\n&0/menu 打开菜单\n/waypoint remove <编号>\n/locatebiome <群系|#标签>\n/locatestructure <结构|#标签>\n/restartgame 投票重置"

# 提示
notice:
  welcome: "%prefix% &b&l欢迎来到方块竞速！按Shift+F打开菜单进行选队和准备！如果没反应，请检查潜行和切换副手的快捷键！如果记分板显示的方块名称不完整，可以使用/block <队伍> <编号> 命令来查询！"
  welcome-lines:
    - "&8&m--------------------------------"
    - "&b&l方块竞速 &8| &f欢迎你，%player%！"
    - "&7按 &bShift+F &7选择队伍并准备。"
    - "&7如果没有反应，请检查潜行和切换副手快捷键。"
    - "&7目标显示不全？可从主菜单查看完整目标。"
    - "&8&m--------------------------------"
  recovered-game:
    - "&8&m--------------------------------"
