# BlockRacing 游戏设置
# 如果服务器已启动，请前往游戏中的设置界面进行设置，不要在这里调整

# 除去easy-block以外的四种额外方块库设置
medium-block: false
hard-block: false
dyed-block: false
end-block: false

# 一局游戏需要收集的方块总数
block-amount: 50

# 游戏模式：
# normal  - 普通模式：两个队伍需要收集的方块及顺序完全随机
# racing  - 竞速模式：两个队伍需要收集的方块及顺序将完全相同
# contest - 争夺模式：双方共享同一方块库，先完成者得分且立即刷新，下一个目标继续争夺
# time    - 计时模式：以限定时长统计队伍完成的任务数量，倒计时结束后积分高者获胜，若平局则进入加时赛
game-mode: normal

# 计时模式配置
# 持续时间单位：分钟，默认 90 分钟
time-mode:
  duration: 120

# 极速模式：
# 开启极速模式后，开局时将会给予玩家部分道具和效果，以加快游戏进度
# 具体发放物品和效果可在 speed-mode-items / speed-mode-effects 中自定义
speed-mode: false

# 队伍箱子馈赠模式：
# 开启后，任意队伍收集到任务方块时，会将一定数量的该方块放进对方的队伍箱子
# 关闭后不会往对方队伍箱子塞方块
# 该选项独立于游戏模式，可与普通/竞速/争夺/计时模式及极速模式叠加
team-chest-gift: false

# 队伍箱子馈赠数量：
# 每次放入对方队伍箱子的该方块数量，范围 1-64
# 也可在准备菜单中右键"队伍箱子馈赠"按钮输入修改
team-chest-gift-amount: 64

# 同点出生模式：
# 开启后红队和蓝队将共享同一个开局出生点，增强对抗性
# 关闭后双方仍使用分离出生点
shared-team-spawn: false

# 末地门坐标广播：
# 开启后，任意队伍激活末地门时会向全服广播末地门坐标
# 关闭后不会广播
end-portal-coordinate-broadcast: false

# 非极速模式开局物品配置
# material: 材质名（如 IRON_PICKAXE）
# amount: 数量（默认1，范围1-64）
# enchants: 直接附魔（格式：附魔名: 等级）
# stored-enchants: 附魔书存储附魔（仅 ENCHANTED_BOOK 生效）
# damage-max-offset: 设置耐久值
# repair-cost: 铁砧花费
base-mode-items:
  - material: STONE_PICKAXE
    amount: 1
    enchants:
      SILK_TOUCH: 1
  - material: STONE_AXE
    amount: 1
  - material: STONE_SHOVEL
    amount: 1

# 极速模式物品配置（支持任意物品）
# 配置规则与 base-mode-items 完全一致
speed-mode-items:
  - material: STONE_AXE
    amount: 1
  - material: STONE_SHOVEL
    amount: 1
  - material: IRON_PICKAXE
    amount: 1
    enchants:
      SILK_TOUCH: 1
  - material: GOLDEN_CARROT
    amount: 64
  - material: ELYTRA
    amount: 1
    damage-max-offset: 1
    repair-cost: 15
  - material: ENCHANTED_BOOK
    amount: 1
    stored-enchants:
      MENDING: 1

# 极速模式效果配置
# amplifier 使用药水放大器（0=I，1=II，2=III ...）
# duration-ticks: 持续时间（-1 表示无限）
# delay-ticks: 延迟发放（tick，20tick=1秒）
speed-mode-effects:
  - type: HASTE
    amplifier: 4
    duration-ticks: -1
    delay-ticks: 0
  - type: SPEED
    amplifier: 1
    duration-ticks: -1
    delay-ticks: 0
  - type: RESISTANCE
    amplifier: 1
    duration-ticks: -1
    delay-ticks: 1300

# 队伍补给配置（极速模式主菜单"购买队伍补给"功能）：
# 购买队伍补给消耗的队伍积分
supply-price: 5

# 发放范围：
# true  - 给予所有本队在线玩家
# false - 仅给予点击购买的玩家
supply-give-all: false

# 队伍补给发放的物品列表
# 配置规则与 base-mode-items 完全一致
supply-items:
  - material: GOLDEN_CARROT
    amount: 16
  - material: FIREWORK_ROCKET
    amount: 8

# 落后补偿：当一队落后达到阈值方块数时，为落后队伍持续提供速度III与抗性III
# 方块差缩小到阈值内后移除；玩家复活后会重新给予补偿效果
# 设为 0 可关闭该机制
comeback-buff-threshold: 20

# 落后补偿效果配置
# amplifier 使用药水放大器（0=I，1=II，2=III ...）
# duration-ticks: 持续时间（-1 表示无限）
comeback-buff-effects:
  - type: SPEED
    amplifier: 2
    duration-ticks: -1
  - type: RESISTANCE
    amplifier: 2
    duration-ticks: -1

# 下界模式：
# 开启后仅使用 NetherBlocks.txt 方块库，并将出生与随机传送限定在下界（阻止通过下界门返回主世界）
# 可与普通/竞速/争夺/计时模式及极速模式叠加
nether-mode: false

# 团队箱子个数
# 默认：8
# 最大：53
max-team-chest-num: 24

# 路径点个数
# 默认：8
# 最大：53
max-team-waypoint-num: 24

# 每队每局最大重掷次数
max-roll-count: 3

# 世界重新生成设置
# 警告：开启后，每次插件启动时将删除并重新生成主世界、下界和末地！
regenerate-worlds-on-startup: false

# 如果你不知道这是什么，不要动它
config-version: 26.3.1
